[env:lafvin-motion]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_src_filter = +<motion.cpp>
upload_speed = 115200

[env:spider-camera]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default.csv
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
build_src_filter = +<camera.cpp> +<sensors.cpp>
extra_scripts = pre:patch_bno_library.py
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    links2004/WebSockets@2.7.1
    adafruit/Adafruit BNO08x@1.2.5
    sparkfun/SparkFun VL53L5CX Arduino Library@1.0.3
