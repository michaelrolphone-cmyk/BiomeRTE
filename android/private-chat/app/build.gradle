plugins { id 'com.android.application' }
android { namespace 'org.biomerte.privatechat'; compileSdk 35
 defaultConfig { applicationId 'org.biomerte.privatechat'; minSdk 26; targetSdk 35; versionCode 5; versionName '0.5.0'; multiDexEnabled true }
 testOptions { unitTests.includeAndroidResources = true }
 buildTypes {
  debug { debuggable false; minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') }
  release { minifyEnabled false }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }
