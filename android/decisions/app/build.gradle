plugins { id 'com.android.application' }
android { namespace 'org.biomerte.decisions'; compileSdk 35
 defaultConfig { applicationId 'org.biomerte.decisions'; minSdk 26; targetSdk 35; versionCode 2; versionName '0.1.1'; multiDexEnabled true }
 testOptions { unitTests.includeAndroidResources = true }
 buildTypes {
  debug { debuggable false; minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') }
  release { minifyEnabled false }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }

def biomeBrandingRes = layout.buildDirectory.dir('generated/biome-branding/res')
android.sourceSets.main.res.srcDir(biomeBrandingRes)
def generateBiomeBranding = tasks.register('generateBiomeBranding') {
 inputs.file('src/main/branding/biome_mark.png.b64')
 outputs.dir(biomeBrandingRes)
 doLast {
  def png = new File(biomeBrandingRes.get().asFile, 'drawable/biome_mark.png')
  png.parentFile.mkdirs()
  png.bytes = file('src/main/branding/biome_mark.png.b64').text.trim().decodeBase64()
 }
}
tasks.named('preBuild').configure { dependsOn(generateBiomeBranding) }

