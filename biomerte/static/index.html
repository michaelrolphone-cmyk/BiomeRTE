<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BiomeRTE</title><link rel="stylesheet" href="/ui.css"></head>
<body><header><span class="mark" aria-hidden="true">⌬</span><h1>BiomeRTE</h1><span id="identity">Controller workspace</span></header>
<main><form id="login"><label>Controller token <input type="password" id="token" autocomplete="off"></label><button>Connect</button><small>Run <code>python3 -m biomerte token</code> on this host.</small></form>
<section id="workspace" hidden><div class="bar"><label>Work in <select id="realm"><option>site</option><option>local</option></select></label><button id="refresh">Refresh</button><button id="logout">Disconnect</button></div>
<nav aria-label="Workspace"><button data-tab="work">Work</button><button data-tab="runs">Processes</button><button data-tab="caps">Capabilities</button><button data-tab="docs">Knowledge</button><button data-tab="attention">Attention</button><button data-tab="bus">Service console</button></nav>
<section id="work" class="tab"><h2>Work plan</h2><form id="new-work"><select id="kind"><option>goal</option><option>milestone</option><option>workflow</option><option>task</option></select><input id="title" placeholder="Outcome or task" required><select id="parent"><option value="">No parent</option></select><button>Add work</button></form><p><button id="demo">Run a complete example</button></p><div id="work-list"></div></section>
<section id="runs" class="tab" hidden><h2>Processes and routines</h2><div id="def-list"></div><h3>Attempts</h3><div id="run-list"></div></section>
<section id="caps" class="tab" hidden><h2>Provider offers</h2><div id="offer-list"></div><h3>Current leases</h3><div id="lease-list"></div></section>
<section id="docs" class="tab" hidden><h2>Knowledge</h2><form id="new-doc"><input id="doc-key" placeholder="Document ID" required><textarea id="doc-body" placeholder="Observation, note, or decision" required></textarea><button>Save revision</button></form><div id="doc-list"></div></section>
<section id="attention" class="tab" hidden><h2>Waiting for a response</h2><div id="wait-list"></div><h3>Inbox</h3><div id="message-list"></div><h3>Enrollment candidates</h3><div id="candidate-list"></div></section>
<section id="bus" class="tab" hidden><h2>Service console</h2><form id="call"><label>Operation <select id="operation"></select></label><p id="help"></p><label>JSON arguments<textarea id="args" rows="7">{}</textarea></label><button>Invoke</button></form></section>
<aside><h3>Selected record or result</h3><pre id="detail">Select a record to inspect it.</pre></aside></section><p id="status" role="status"></p></main><script src="/ui.js"></script></body></html>
