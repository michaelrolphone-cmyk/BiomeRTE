name: Resume guarded cleanup of original GHCR publication
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the exact remainder or delete only the original packages
        type: choice
        required: true
        default: verify
        options:
          - verify
          - delete
permissions:
  contents: read
  packages: write
concurrency:
  group: ghcr-original-publication-cleanup-44648102932
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'michaelrolphone-cmyk/BiomeRTE' && github.ref == 'refs/heads/work/ghcr-guarded-cleanup-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the exact cleanup guards without network access
        run: python3 -B -m unittest discover -s tests -p test_ghcr_cleanup.py -v
      - name: Inspect or clean up the verified original publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEANUP_MODE: ${{ inputs.mode }}
        run: python3 -B deploy/docker-services/ghcr_cleanup.py --mode "$CLEANUP_MODE"
      - name: Retain nonsecret cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghcr-cleanup-44648102932-receipt
          path: |
            ghcr-cleanup-44648102932.receipt.json
            deploy/docker-services/ghcr-cleanup-44648102932.inventory.json
            deploy/docker-services/ghcr-cleanup-44654682862.prior-receipt.json
          if-no-files-found: error
          retention-days: 30
