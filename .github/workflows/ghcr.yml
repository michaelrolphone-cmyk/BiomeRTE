name: Inspect source workflow access to the private GHCR pilot
on:
  workflow_dispatch:
permissions:
  packages: read
jobs:
  inspect:
    if: github.repository == 'michaelrolphone-cmyk/BiomeRTE'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the exact private pilot package once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          name = "biomerte-service-runner"
          expected_id = 17087654
          result = {"expected_id": expected_id, "requested_name": name, "access_verified": False}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, url):
                  return None

          request = urllib.request.Request(
              "https://api.github.com/users/michaelrolphone-cmyk/packages/container/" + name,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "biomerte-source-package-access-diagnostic",
              },
              method="GET",
          )
          exit_code = 1
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                  value = json.load(response)
                  repository = value.get("repository") or {}
                  result.update({
                      "http_status": response.status, "id": value.get("id"), "name": value.get("name"),
                      "type": value.get("package_type"), "visibility": value.get("visibility"),
                      "repository": {key: repository.get(key) for key in ("id", "full_name", "private")},
                  })
                  result["access_verified"] = (
                      response.status == 200 and value.get("id") == expected_id
                      and value.get("name") == name and value.get("package_type") == "container"
                      and value.get("visibility") == "private"
                  )
                  exit_code = 0 if result["access_verified"] else 1
          except urllib.error.HTTPError as error:
              result["http_status"] = error.code
              exit_code = 0 if error.code in (401, 403, 404) else 1
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError, AttributeError, TypeError):
              result.update(http_status=None, error="No verified package metadata response")
          print(json.dumps(result, sort_keys=True), flush=True)
          raise SystemExit(exit_code)
          PY
