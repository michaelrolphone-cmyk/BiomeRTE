name: Inspect GHCR package visibility
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  inspect:
    if: github.repository == 'michaelrolphone-cmyk/BiomeRTE'
    runs-on: ubuntu-24.04
    steps:
      - name: Read exact package metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          owner = "michaelrolphone-cmyk"
          names = ("service-runner", "service-authority", "portable-services")
          for name in names:
              request = urllib.request.Request(
                  "https://api.github.com/users/" + owner + "/packages/container/" + name,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "biomerte-ghcr-private-diagnostic"})
              try:
                  with urllib.request.urlopen(request) as response:
                      value = json.load(response)
                      source = value.get("repository") or {}
                      print(json.dumps({
                          "requested_name": name, "http_status": response.status,
                          "name": value.get("name"), "type": value.get("package_type"),
                          "visibility": value.get("visibility"), "id": value.get("id"),
                          "url": value.get("html_url"),
                          "source_repository": source.get("full_name"),
                          "source_repository_visibility": source.get("visibility"),
                          "source_repository_private": source.get("private")}, sort_keys=True))
              except urllib.error.HTTPError as error:
                  print(json.dumps({"requested_name": name, "http_status": error.code}, sort_keys=True))
          PY
