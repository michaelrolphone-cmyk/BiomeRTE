name: Published rover contract
on: [pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check console compatibility and schema evolution
        env:
          ROVER_CONTRACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 -m unittest discover -s tests -p test_rover_console_contract.py -v
