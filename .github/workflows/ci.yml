name: BiomeRTE qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -v
      - name: Qualify assistant workflows and recovery
        run: python3 -S -m unittest discover -s integrations/proactive_assistant/tests -v
      - name: Qualify the LM Studio coding adapter
        run: python3 -S -m unittest discover -s providers/lmstudio -p 'test_coding.py' -v
      - name: Start a fresh clone and run an actual work cycle
        run: |
          export BIOME_HOME="$RUNNER_TEMP/biome-node"
          ./biome init > "$RUNNER_TEMP/public-identity.json"
          ./biome demo
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
        working-directory: gateway
      - run: |
          mkdir -p .openai
          cp hosting.example.json .openai/hosting.json
          npm run build
          npm run validate
        working-directory: gateway
  replicated-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/etcd-lab.yml up -d
      - run: python3 -m tests.cluster_qualification
      - if: always()
        run: docker compose -f deploy/etcd-lab.yml down -v
