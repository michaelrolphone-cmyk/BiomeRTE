name: BiomeRTE qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install controller and production qualification dependencies
        run: python3 -m pip install aiohttp==3.14.5 Pillow
      - run: python3 -m unittest discover -v
      - name: Qualify assistant workflows and recovery
        run: python3 -S -m unittest discover -s integrations/proactive_assistant/tests -v
      - name: Qualify the LM Studio coding adapter
        run: python3 -S -m unittest discover -s providers/lmstudio -p 'test_coding.py' -v
      - name: Start a fresh clone and run an actual work cycle
        run: |
          export BIOME_HOME="$RUNNER_TEMP/biome-node"
          ./biome init > "$RUNNER_TEMP/public-identity.json"
          ./biome demo
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p .openai
          cp hosting.example.json .openai/hosting.json
          npm run build
          npm run validate
        working-directory: gateway
      - run: node --test tests/*.test.mjs
        working-directory: gateway
  docker-lease-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/BiomeRTE-Heorku-Gateway-Stream
          ref: d69a3a5a88523cafbad99a46d8039a965f58ba55
          path: gateway-fixture
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp==3.14.5
      - name: Exercise acquire, release, restart and expiry on Docker
        env:
          BIOME_TEST_COORDINATOR: gateway-fixture/biomerte/service_coordinator.py
          BIOME_TEST_LEASE_IMAGE: biome-lease-ci
        run: |
          printf 'FROM busybox:1.36.1\nVOLUME /lease-tmp\n' | docker build -q -t "$BIOME_TEST_LEASE_IMAGE" -
          python -m unittest -v tests.qualify_capability_lease_docker.RealLease.test_disposable_worker
  replicated-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/etcd-lab.yml up -d
      - run: python3 -m tests.cluster_qualification
      - if: always()
        run: docker compose -f deploy/etcd-lab.yml down -v

  live-streaming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy opencv-python-headless websockets aiohttp
      - run: python -m unittest discover -s providers/robot-vision/tests -v
      - name: Read the native source pin and patch paths
        id: native-source
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('providers/robot-vision/pyslam-patches.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('commit=' + manifest['pyslam_commit'], file=output)
              print('paths<<NATIVE_PATHS', file=output)
              for patch in manifest['patches']:
                  print(patch['path'], file=output)
              print('NATIVE_PATHS', file=output)
      - uses: actions/checkout@v4
        with:
          repository: luigifreda/pyslam
          ref: ${{ steps.native-source.outputs.commit }}
          path: .ci/pyslam
          sparse-checkout: ${{ steps.native-source.outputs.paths }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify native transforms against the pinned upstream files
        env:
          PYSLAM_TEST_SOURCE: .ci/pyslam
          PYTHONPATH: providers/robot-vision:providers/robot-vision/tests
        run: python -m unittest test_radio_relocalization_prior.RadioRelocalizationPriorTests.test_manifest_matches_exact_transforms_and_other_native_files_unchanged -v
      - run: python -m unittest tests.test_stream_wire_integration tests.test_shared_streams tests.test_stream_payload_errors tests.test_rover_subscription_owner tests.test_portable_services -v
      - run: python -m compileall -q biomerte providers/robot-vision
