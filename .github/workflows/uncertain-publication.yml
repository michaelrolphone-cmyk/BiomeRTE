name: Qualify uncertain publication compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frozen-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_supervised_publication tests.test_worker_fast_follow -v
