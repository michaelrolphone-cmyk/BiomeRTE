name: Robot mapping preflight
on:
  push:
    paths:
      - 'providers/robot-vision/mapping_preflight.py'
      - 'providers/robot-vision/tests/test_mapping_preflight.py'
      - '.github/workflows/robot-mapping-preflight.yml'
  pull_request:
    paths:
      - 'providers/robot-vision/mapping_preflight.py'
      - 'providers/robot-vision/tests/test_mapping_preflight.py'
      - '.github/workflows/robot-mapping-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -S -m unittest discover -s providers/robot-vision/tests -p test_mapping_preflight.py -v
